name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  read-versions:
    name: Read GTNH test versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
      - name: Read GTNH test versions
        id: read
        shell: bash
        run: |
          versions=$(jq -ce . gtnh-test-versions.json)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: GTNH ${{ matrix.gtnh }}
    needs: read-versions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        gtnh: ${{ fromJSON(needs.read-versions.outputs.versions) }}
    env:
      GTNH_VERSION: ${{ matrix.gtnh }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up the CI workspace
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --stacktrace setupCIWorkspace \
            "-Pelytra.manifest.version=${GTNH_VERSION}"

      - name: Build and test
        run: |
          ./gradlew --no-daemon --no-configuration-cache --stacktrace build \
            "-Pelytra.manifest.version=${GTNH_VERSION}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-libs-gtnh-${{ matrix.gtnh }}
          path: build/libs/
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-gtnh-${{ matrix.gtnh }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: ignore
