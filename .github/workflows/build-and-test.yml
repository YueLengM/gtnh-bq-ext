name: Build and test

on:
  pull_request:
    branches: [ master, main ]
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  read-versions:
    name: Read GTNH test versions
    runs-on: ubuntu-26.04
    outputs:
      versions: ${{ steps.read.outputs.versions }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read GTNH test versions
        id: read
        shell: bash
        run: |
          versions=$(jq -ce '
            if type == "array"
              and length > 0
              and all(.[]; type == "string" and test("^[^[:space:]]+$"))
              and (length == (unique | length))
            then .
            else error("Expected a non-empty array of unique GTNH version strings")
            end
          ' gtnh-test-versions.json)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  build-and-test:
    name: GTNH ${{ matrix.gtnh }}
    needs: read-versions
    strategy:
      fail-fast: false
      matrix:
        gtnh: ${{ fromJSON(needs.read-versions.outputs.versions) }}
    uses: ./.github/workflows/gtnh-build-and-test.yml
    with:
      gtnh-version: ${{ matrix.gtnh }}
    secrets: inherit
